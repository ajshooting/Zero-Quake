name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove .git directory
        run: rm -rf .git

      - name: Build macOS app
        run: npx electron-builder --mac --publish never -c.directories.output="${{ runner.temp }}/dist_mac"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: 'electron-builder'

      - name: Check asar contents
        run: find build_mac_output -name "app.asar" -exec npx asar list {} \; | grep -E "build_mac_output|\.git|eslint|prettier" || echo "Clean!"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: zero-quake-macos
          path: ${{ runner.temp }}/dist_mac/*.dmg
          if-no-files-found: error

      - name: Upload GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/dist_mac/*.dmg